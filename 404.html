    padding:.9rem 1.5rem;border-radius:999px;font-weight:600;font-size:.92rem;
    transition:transform .2s;
  }
  a:hover{transform:translateY(-2px)}
  .primary{background:var(--grad);color:#03060d;box-shadow:0 14px 34px -12px rgba(59,130,246,.85)}
